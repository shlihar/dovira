[program:dovira-ai-enrichment]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php -d max_execution_time=0 /var/www/dovira/current/artisan dovira:ai-enrichment:work
directory=/var/www/dovira/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/dovira/shared/storage/logs/ai-enrichment-worker.log
stopwaitsecs=1900
