services:
  - type: web
    name: dovira
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # schedule:work — фоновий планувальник (експірація PRO тощо); без нього
    # жодна Schedule::command із routes/console.php на проді не виконується.
    dockerCommand: sh -lc "php artisan schedule:work & php artisan serve --host=0.0.0.0 --port=${PORT:-10000}"
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: DOVIRA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://dovira-rl2o.onrender.com
      - key: APP_LOCALE
        value: uk
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Єдина БД — зовнішня MySQL; sqlite в ефемерному контейнері втрачала б
      # дані при кожному деплої. Креденшли — в Render Dashboard.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: hb423250.mysql.tools
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: APP_MAINTENANCE_DRIVER
        value: file
      # SMTP: пошта info@mydovira.com на хостингу adm.tools.
      # Пароль скриньки задається в Render Dashboard (sync: false).
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: mail.adm.tools
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: info@mydovira.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: info@mydovira.com
      - key: MAIL_FROM_NAME
        value: DOVIRA
      # Холодний аутріч на незаявлені профілі про негативні відгуки (двигун
      # аквізиції PRO). Event-тригер, не масова розсилка. Увімкнено свідомо.
      - key: REVIEW_OUTREACH_ENABLED
        value: "true"
      # Соцвхід: креденшли задаються в Render Dashboard (sync: false).
      # Кнопки на /login і /register вмикаються автоматично, щойно
      # відповідна пара ключів зʼявляється в оточенні.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://dovira-rl2o.onrender.com/auth/google/callback
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        value: https://dovira-rl2o.onrender.com/auth/facebook/callback
      - key: TELEGRAM_BOT_NAME
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
